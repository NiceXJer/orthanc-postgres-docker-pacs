services:
  postgres-db:
    image: postgres:15-alpine
    container_name: orthanc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: orthanc_db
      POSTGRES_USER: orthanc_user
      POSTGRES_PASSWORD: REMOVED_DB_PASSWORD
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - pacs-network

  orthanc-server:
    image: orthancteam/orthanc:latest
    container_name: orthanc-core
    restart: unless-stopped
    depends_on:
      - postgres-db
    ports:
      - "8042:8042"
      - "4242:4242"
    environment:
      POSTGRESQL_PLUGIN_ENABLED: "true"
      OHIF_PLUGIN_ENABLED: "true"
      DICOM_WEB_PLUGIN_ENABLED: "true"
    volumes:
      - ./orthanc.json:/etc/orthanc/orthanc.json:ro
      - orthanc-storage:/var/lib/orthanc/db
    networks:
      - pacs-network

  ohif-viewer:
    image: ohif/viewer:latest
    container_name: ohif-viewer
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - pacs-network

  mirth-connect:
    image: nextgenhealthcare/connect:latest
    container_name: mirth-engine
    restart: unless-stopped
    environment:
      - VMOPTIONS=-Xmx1024m
    ports:
      - "8080:8080"   # Mirth Web Dashboard / HTTP API
      - "8443:8443"   # Mirth Admin Console (HTTPS)
      - "6661:6661"   # HL7 MLLP Inbound Listener Port
      - "6662:6662"   # HL7 FHIR 
    volumes:
      - mirth-data:/opt/connect/appdata
    networks:
      - pacs-network

networks:
  pacs-network:
    driver: bridge

volumes:
  postgres-data:
  orthanc-storage:
  mirth-data: